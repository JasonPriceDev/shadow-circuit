name: Bug
description: Report a reproducible defect in the game, build, CI, or agent.
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:proposed"
body:
  - type: input
    id: parent
    attributes:
      label: Related Spec, Epic, or Feature
      placeholder: "#123 or None"
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Scene, stage, boss, or system
    validations:
      required: false

  - type: input
    id: revision
    attributes:
      label: Revision or build
      placeholder: main at abc1234
    validations:
      required: false

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options: [Always, Often, Sometimes, Once, Unknown]
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      render: text
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or related links
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity estimate
      options:
        - "Critical — crash, broken build, data loss, or unplayable game"
        - "Major — materially wrong behavior or blocked gameplay"
        - "Minor — cosmetic issue, isolated edge case, or polish"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Reporter checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets from the report.
          required: true
