name: Feature
description: Track an independently valuable outcome requiring multiple Tasks.
title: "[Feature]: "
labels:
  - "type:feature"
  - "status:proposed"
body:
  - type: input
    id: artifact-id
    attributes:
      label: Artifact ID
      placeholder: FEATURE-player-damage
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent Spec or Epic
      placeholder: "#123 / SPEC-core-gameplay"
    validations:
      required: true

  - type: input
    id: root-spec
    attributes:
      label: Root Spec
      placeholder: "#100 / SPEC-core-gameplay"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Feature outcome
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Likely files or symbols
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [player, enemy, boss, stage, systems, ui, build, ci, agent]
    validations:
      required: true

  - type: dropdown
    id: discipline
    attributes:
      label: Primary discipline
      options: [code, art, audio, design, qa]
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This outcome requires multiple independently reviewable Tasks.
          required: true
