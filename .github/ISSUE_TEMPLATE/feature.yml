name: Feature
description: Define an independently valuable outcome within a Spec or Epic.
title: "[Feature]: "
labels:
  - "type:feature"
  - "status:proposed"
body:
  - type: markdown
    attributes:
      value: |
        Features are optional. Use one when an approved Spec or Epic needs
        multiple independently reviewable Tasks. Agent-created Features receive
        `agent:generated` through the mutation tool.

  - type: input
    id: parent
    attributes:
      label: Parent Spec or Epic
      description: Number of the direct parent `type:spec` or `type:epic` issue.
      placeholder: "#123"
    validations:
      required: true

  - type: input
    id: root-spec
    attributes:
      label: Root Spec
      description: Number of the top-level `type:spec` issue for traceability.
      placeholder: "#100"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Feature outcome
      description: Describe the independently valuable behavior or capability.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes completed by this Feature's Tasks.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Likely files or systems
      description: Add paths or symbols when known; the plan determines the exact change set.
      placeholder: |
        - `src/scenes/StageScene.ts`
        - `Player` damage handling
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: The agent maps this value to the corresponding `area:*` label.
      options:
        - "player"
        - "enemy"
        - "boss"
        - "stage"
        - "systems"
        - "ui"
        - "build"
        - "ci"
        - "agent"
    validations:
      required: true

  - type: dropdown
    id: discipline
    attributes:
      label: Primary discipline
      description: The agent maps this value to the corresponding `discipline:*` label.
      options:
        - "code"
        - "art"
        - "audio"
        - "design"
        - "qa"
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This outcome requires multiple independently reviewable Tasks.
          required: true
