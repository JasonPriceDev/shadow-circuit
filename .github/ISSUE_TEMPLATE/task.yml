name: Task
description: Define one bounded, implementable unit with at most one pull request.
title: "[Task]: "
labels:
  - "type:task"
  - "status:proposed"
body:
  - type: markdown
    attributes:
      value: |
        A Task is the implementation boundary. Its scope, acceptance criteria,
        and likely files must be reviewable as one pull request. Submitting this
        form does not authorize implementation; the matching proposal requires
        the single-use `approve:implement` label.

        Agent-created Tasks receive `agent:generated` through the mutation tool,
        not from this human-facing template.

  - type: input
    id: parent
    attributes:
      label: Parent Spec or Feature
      description: Use the direct `type:spec` parent for normal work or `type:feature` for a larger hierarchy.
      placeholder: "#200"
    validations:
      required: true

  - type: input
    id: root-spec
    attributes:
      label: Root Spec
      description: Number of the approved top-level `type:spec` issue.
      placeholder: "#100"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bounded change
      description: Describe one implementable unit and explicitly identify what is out of scope.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include change-specific outcomes; standard build gates are already part of Definition of Done.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List applicable automated checks and manual playtest evidence.
      value: |
        - [ ] `npm run typecheck`
        - [ ] `npm run build`
        - [ ] Manual playtest or runtime verification completed when required
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Expected files or symbols
      description: Name expected paths and symbols without relying on line numbers.
      placeholder: |
        - Create `src/components/Invulnerability.ts`
        - Modify the player/enemy collision callback in `src/scenes/StageScene.ts`
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: The agent maps this value to the corresponding `area:*` label.
      options:
        - "player"
        - "enemy"
        - "boss"
        - "stage"
        - "systems"
        - "ui"
        - "build"
        - "ci"
        - "agent"
    validations:
      required: true

  - type: dropdown
    id: discipline
    attributes:
      label: Primary discipline
      description: The agent maps this value to the corresponding `discipline:*` label.
      options:
        - "code"
        - "art"
        - "audio"
        - "design"
        - "qa"
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This Task can be implemented and reviewed as at most one pull request.
          required: true
