name: Task
description: Define one bounded implementation unit with at most one pull request.
title: "[Task]: "
labels:
  - "type:task"
  - "status:proposed"
body:
  - type: input
    id: artifact-id
    attributes:
      label: Artifact ID
      placeholder: TASK-player-invulnerability
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent Spec or Feature
      placeholder: "#200 / FEATURE-player-damage"
    validations:
      required: true

  - type: input
    id: root-spec
    attributes:
      label: Root Spec
      placeholder: "#100 / SPEC-core-gameplay"
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: Bounded change and non-goals
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      value: |
        - [ ] `npm run typecheck`
        - [ ] `npm run build`
        - [ ] Focused runtime or playtest evidence when required
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Expected files or symbols
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [player, enemy, boss, stage, systems, ui, build, ci, agent]
    validations:
      required: true

  - type: dropdown
    id: discipline
    attributes:
      label: Primary discipline
      options: [code, art, audio, design, qa]
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This Task can be implemented and reviewed as at most one pull request.
          required: true
