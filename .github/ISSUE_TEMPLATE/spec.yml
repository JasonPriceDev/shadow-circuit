name: Spec
description: Track a draft or approved specification.
title: "[Spec]: "
labels:
  - "type:spec"
  - "status:proposed"
body:
  - type: markdown
    attributes:
      value: |
        Specs are normally drafted by the agent from an approved discovery
        record. This form may also register an existing Spec.

  - type: input
    id: artifact-id
    attributes:
      label: Artifact ID
      placeholder: SPEC-core-gameplay
    validations:
      required: true

  - type: input
    id: spec-file
    attributes:
      label: Specification file
      placeholder: docs/specs/core-gameplay.md
    validations:
      required: true

  - type: input
    id: concept
    attributes:
      label: Parent Concept issue
      placeholder: "#12"
    validations:
      required: true

  - type: textarea
    id: review
    attributes:
      label: Review focus
      description: Identify questions, disputed decisions, or prototype areas to review.
    validations:
      required: false

  - type: checkboxes
    id: authority
    attributes:
      label: Authority
      options:
        - label: I understand that registering a Spec does not approve it or authorize implementation.
          required: true
