name: Spec
description: Propose a coherent product or engineering outcome for review and planning.
title: "[Spec]: "
labels:
  - "type:spec"
  - "status:proposed"
body:
  - type: markdown
    attributes:
      value: |
        A Spec defines outcomes and acceptance criteria. The normal hierarchy is
        **Spec → Task → Pull Request**. Use **Epic → Feature** layers only when
        the work has multiple independently valuable delivery streams.

        The agent reviews this proposal and posts questions or a plan with a
        proposal ID. Human approval is recorded with the workflow's single-use
        approval labels; submitting this form does not authorize implementation.

  - type: input
    id: spec-file
    attributes:
      label: Specification file
      description: Path to the Markdown specification in `docs/specs/`, when one exists.
      placeholder: docs/specs/lantern-rooftops-combat.md
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Explain the outcome, the user or player benefit, and why it matters.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, independently verifiable outcomes.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design notes and constraints
      description: Include approved mechanics, patterns, layouts, tuning, and constraints.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link required issues, specifications, assets, or external decisions.
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks and open questions
      description: Identify uncertainty, tradeoffs, and decisions that require human input.
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Verification approach
      description: Describe expected automated checks and manual playtest evidence.
      placeholder: |
        - `npm run typecheck`
        - `npm run build`
        - Manual playtest: verify the damage cooldown at 60 Hz and 120 Hz
    validations:
      required: false

  - type: dropdown
    id: breakdown
    attributes:
      label: Expected breakdown
      description: This is an estimate; the reviewed plan determines the final hierarchy.
      options:
        - "Direct Tasks — normal choice for small or focused work"
        - "Features and Tasks — several independently reviewable outcomes"
        - "Epics, Features, and Tasks — multiple large delivery streams"
        - "Research first — scope or feasibility is not yet clear"
    validations:
      required: true

  - type: checkboxes
    id: authority
    attributes:
      label: Authority
      options:
        - label: I understand that this is a proposal and does not authorize implementation.
          required: true
