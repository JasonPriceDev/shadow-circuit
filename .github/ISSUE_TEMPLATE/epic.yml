name: Epic
description: Track a large delivery stream within an approved Spec.
title: "[Epic]: "
labels:
  - "type:epic"
  - "status:proposed"
body:
  - type: input
    id: artifact-id
    attributes:
      label: Artifact ID
      placeholder: EPIC-vertical-slice
    validations:
      required: true

  - type: input
    id: parent-spec
    attributes:
      label: Parent Spec
      placeholder: "#100 / SPEC-core-gameplay"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Independently valuable outcome
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and sequencing
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [player, enemy, boss, stage, systems, ui, build, ci, agent]
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This work requires multiple independently valuable Features.
          required: true
