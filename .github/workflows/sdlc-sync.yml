name: SDLC Traceability

on:
  pull_request:
    paths:
      - "docs/discovery/**"
      - "docs/plans/**"
      - "docs/specs/**"
      - "docs/mockups/**"
      - "prototypes/**"
      - "docs/sdlc/**"
      - "scripts/sdlc/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: sdlc-traceability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install synchronization dependencies
        run: python -m pip install --requirement agents/requirements.txt

      - name: Validate artifact graph
        run: python scripts/sdlc/traceability.py validate

      - name: Test synchronization logic
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Report downstream impact
        run: python scripts/sdlc/traceability.py impact --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Require reviewed snapshot
        run: python scripts/sdlc/traceability.py snapshot --check

      - name: Preview managed issue metadata
        run: python scripts/sdlc/sync_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
