name: SDLC Bootstrap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create or update labels and create missing milestones"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement agents/requirements.txt

      - name: Preview taxonomy
        if: ${{ !inputs.apply }}
        continue-on-error: true
        run: python scripts/sdlc/bootstrap_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply taxonomy
        if: ${{ inputs.apply }}
        run: python scripts/sdlc/bootstrap_github.py --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_BOOTSTRAP_APPROVED: "true"
